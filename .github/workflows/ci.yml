name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check --no-fix src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked ty check src/copyedit_ai

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run --locked --group docs mkdocs build --strict
      - name: Upload Pages preview artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - name: Download Pages preview artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-preview/
      - name: Verify Pages archive
        run: |
          mkdir pages-extracted
          tar -xf pages-preview/artifact.tar -C pages-extracted
          test -s pages-extracted/index.html
          test -s pages-extracted/search/search_index.json
          test -s pages-extracted/reference/copyedit_ai/index.html

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv build
      - name: Smoke-test wheel and source distribution
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact="$(realpath "$artifact")"
            smoke_dir="$(mktemp -d)"
            uv venv "$smoke_dir/venv" --python 3.14
            uv pip install --python "$smoke_dir/venv/bin/python" "$artifact"
            (
              cd "$smoke_dir"
              export LLM_USER_PATH="$smoke_dir/llm"
              export XDG_DATA_HOME="$smoke_dir/data"
              "$smoke_dir/venv/bin/copyedit" --help
              "$smoke_dir/venv/bin/copyedit_ai" --version
              "$smoke_dir/venv/bin/copyedit" self --help
              "$smoke_dir/venv/bin/copyedit" self models --help
            )
          done
